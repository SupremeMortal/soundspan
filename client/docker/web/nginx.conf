#
# nginx configuration of the web client image (doc 10, Web: Headers, CSP,
# Container). Every writable path is under /tmp, so the server runs as any
# UID with a read-only root filesystem.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
        application/json application/manifest+json application/wasm
        image/svg+xml;

    # A file whose name has a dot-separated segment of 8 or more hex digits
    # is content-hashed and never changes. Everything else, Flutter's
    # unhashed output included, is revalidated against its ETag.
    map $uri $soundspan_cache_control {
        "~/(?:[^/]*\.)?[0-9A-Fa-f]{8,}\.[^/]*$" "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        etag on;
        # Relative Location headers keep redirects right behind a proxy.
        absolute_redirect off;

        # Set here only: a location with an add_header of its own would
        # drop these.
        add_header Cache-Control $soundspan_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src *; img-src * blob: data:; media-src *; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            return 302 /app/;
        }

        location = /app {
            return 301 /app/;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # The router uses the path URL strategy: a path that matches no
        # file is a route of the app.
        location /app/ {
            try_files $uri /app/index.html;
        }
    }
}
