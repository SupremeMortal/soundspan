name: spike_s4
description: "Spike S4 harness: smtc_windows build, toolchain and System Media Transport Controls updates."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  smtc_windows: 1.1.0
  # Pinned to the codegen version of smtc_windows 1.1.0: the runtime refuses
  # any other version, and the client resolves 2.13.0.
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/
