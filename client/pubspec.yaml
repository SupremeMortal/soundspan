name: soundspan
description: First-party soundspan client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  app_links: ^7.2.0
  archive: ^4.7.1                # Log export zip (lib/core/logging/log_bundle.dart); tool/gen_icons.dart
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  audio_session: ^0.2.4
  background_downloader: ^9.6.0
  cached_network_image: ^4.0.0
  collection: ^1.19.0
  connectivity_plus: ^7.3.0
  crypto: ^3.0.6                 # SHA-1 of download item keys, artwork and track cache keys; tool/release/check_artifacts.dart
  dbus: any                      # StatusNotifier host check of the Linux tray; integration_test/support/session_bus_names_io.dart
  disk_space_2: ^1.0.13          # Free space before a download (lib/platform/disk_space)
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  dynamic_color: ^2.1.0          # Only to read the platform contrast setting; palette is fixed
  file: ^7.0.1                   # Files of the native image store (lib/platform/image_cache)
  file_selector: ^1.1.0          # Save dialog of the desktop log export
  flutter: { sdk: flutter }
  flutter_cache_manager: any
  flutter_local_notifications: ^23.0.0
  flutter_localizations: { sdk: flutter }
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0             # Logo mark and other SVG glyphs
  flutter_web_plugins: { sdk: flutter }  # Path URL strategy on web
  freezed_annotation: ^3.0.0
  go_router: ^18.1.0
  intl: any
  json_annotation: ^4.9.0
  just_audio: ^0.10.6            # Android, iOS, macOS, web
  logging: ^1.3.0
  material_ui: ^1.1.0            # Material widgets; moved out of the Flutter SDK
  media_kit: ^1.2.6              # Windows, Linux
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  mobile_scanner: ^7.5.0         # QR; Android, iOS, macOS, web
  package_info_plus: ^10.2.0
  path: ^1.9.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.0
  screen_retriever: ^0.4.0       # Displays, for window-bounds restore
  share_plus: ^13.3.1            # Share sheet of the mobile log export
  socket_io_client: ^3.1.6
  soundspan_api: { path: packages/soundspan_api }
  soundspan_smtc: { path: packages/soundspan_smtc }   # Windows media controls (spike S4)
  sqlite3: ^3.9.1                # WASM in-memory fallback of the web DatabaseOpener
  tray_manager: ^0.9.0
  url_launcher: any
  web: ^1.1.0                    # sessionStorage for the web SecretStore
  window_manager: ^0.7.0

dev_dependencies:
  alchemist: ^0.14.0
  analyzer: ^14.7.0              # tool/check_imports.dart
  build_runner: any
  dio: any                       # Fake HTTP adapters in tests
  drift_dev: ^2.35.0
  fake_async: ^1.3.3             # Timers in unit tests
  flutter_test: { sdk: flutter }
  freezed: ^4.0.0
  http_mock_adapter: any
  image: ^4.12.0                 # tool/gen_icons.dart
  integration_test: { sdk: flutter }
  json_serializable: ^6.15.0
  mocktail: ^1.0.5
  patrol: ^4.11.0
  riverpod_generator: ^4.0.0
  shelf: ^1.4.2                  # integration_test/support/tone_server.dart
  very_good_analysis: ^11.0.0
  xml: ^7.0.0                    # tool/check_platform_config.dart
  yaml: ^3.1.0                   # tool/license_audit.dart

# Patrol (doc 11, Integration (mobile)); run with patrol_cli 4.9.0.
patrol:
  app_name: soundspan
  test_directory: integration_test/patrol
  android:
    package_name: io.soundspan.app

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/brand/tray/
    - assets/licenses/
    - assets/licenses/fonts/
    - LICENSE                      # the client's own licence (Licences screen)
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
    - family: Turret Road          # Wordmark only
      fonts:
        - asset: assets/fonts/TurretRoad-ExtraBold.ttf
          weight: 800
