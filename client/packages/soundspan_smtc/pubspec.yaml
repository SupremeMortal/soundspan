name: soundspan_smtc
description: The Windows System Media Transport Controls for the soundspan client, as an in-repo C++/WinRT plugin.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: SoundspanSmtcPluginCApi
