name: Client Spikes

# Throwaway spike harnesses of docs/designs/flutter-client/13-milestones-and-work-breakdown.md
# (Spikes). Each job runs a harness on a device and writes
# its measurements to the job summary and an artifact. A spike's jobs are
# deleted together with its harness.

on:
  pull_request:
    paths:
      - "client/spikes/**"
      - ".github/workflows/client-spikes.yml"

concurrency:
  group: client-spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike-s5-linux:
    name: spike-s5-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The plugin's task store lives under the XDG documents directory,
      # which path_provider resolves with xdg-user-dir.
      - name: Install ffmpeg, Xvfb and xdg-user-dirs
        run: sudo apt-get install -y --no-install-recommends ffmpeg xvfb xdg-user-dirs

      - name: Generate the fixture library
        working-directory: client/contract_test
        run: fixtures/generate.sh

      - name: Start the contract server
        working-directory: client/contract_test
        run: docker compose -f compose.yaml up -d --build --wait

      - name: Seed the contract server
        working-directory: client/contract_test
        run: node seed.ts

      - name: Resolve harness dependencies
        working-directory: client/spikes/s5
        run: flutter pub get

      - name: Run the harness on Linux
        working-directory: client/spikes/s5
        run: |
          set -o pipefail
          xvfb-run -a flutter test integration_test -d linux \
            --dart-define=S5_SEED="$GITHUB_WORKSPACE/client/contract_test/.seed/credentials.json" \
            2>&1 | tee s5.log

      - name: Summarise
        if: always()
        working-directory: client/spikes/s5
        run: |
          touch s5.log
          grep -o 'S5-HTTP .*' s5.log > proxy-log.txt || true
          {
            echo "### Spike S5, Linux"
            echo
            echo '```'
            grep -o 'S5-\(VERSION\|Q[0-9]\) .*' s5.log || echo "no result lines"
            echo '```'
            echo
            echo '```'
            cat proxy-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proxy log and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s5-linux
          path: |
            client/spikes/s5/s5.log
            client/spikes/s5/proxy-log.txt

      - name: Tear down the contract server
        if: always()
        working-directory: client/contract_test
        run: docker compose -f compose.yaml down -v --remove-orphans

  spike-s5-android:
    name: spike-s5-android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build the harness APK
        working-directory: client/spikes/s5
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the driver on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          S5_API: 34
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/spikes/s5
          script: bash -o pipefail -c 'bash run.sh build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee run.log'

      - name: Summarise
        if: always()
        working-directory: client/spikes/s5
        run: |
          {
            echo "### Spike S5, Android emulator API 34"
            echo
            echo '```'
            grep '^S5-Q4' run.log 2>/dev/null || echo "no result lines"
            echo '```'
            echo
            echo '```'
            grep -o 'S5-HTTP .*' slow-server.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logcat and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s5-android
          path: |
            client/spikes/s5/run.log
            client/spikes/s5/results.txt
            client/spikes/s5/spike-lines.txt
            client/spikes/s5/logcat-full.txt
            client/spikes/s5/slow-server.log
