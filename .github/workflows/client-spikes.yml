name: Client Spikes

on:
  pull_request:
    paths:
      - "client/spikes/**"
      - ".github/workflows/client-spikes.yml"

concurrency:
  group: client-spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike-s8:
    name: spike-s8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client/spikes/s8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Resolve spike dependencies
        run: |
          dart pub get
          {
            echo "## Spike S8"
            echo
            echo "Dart: \`$(dart --version 2>&1)\`"
            echo
            echo '| Package | Version |'
            echo '|---|---|'
            for p in swagger_parser swagger_parser_core freezed freezed_annotation json_serializable retrofit retrofit_generator dio build_runner; do
              v="$(awk -v p="  $p:" '$0==p{f=1} f&&/version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)"
              echo "| \`$p\` | $v |"
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Q1: generate"
        run: |
          dart run tool/open_objects.dart ../../packages/soundspan_api/openapi/soundspan-client.json build/soundspan-client.open.json
          dart run swagger_parser

      - name: "Q1: build_runner"
        run: dart run build_runner build --delete-conflicting-outputs

      - name: "Q1: analyze"
        run: dart analyze --fatal-infos

      - name: "Q2-Q8: decode and client tests"
        run: dart test --reporter expanded --file-reporter json:build/results.json

      - name: Write results to the job summary
        if: always()
        run: |
          {
            echo "Q1 (generate, build_runner, analyze): ${{ job.status == 'success' && 'yes' || 'see the step log' }}"
            echo
            echo '| Test | Result |'
            echo '|---|---|'
            if [[ -f build/results.json ]]; then
              jq -rs '
                (map(select(.type == "testStart") | {key: (.test.id | tostring), value: .test.name}) | from_entries) as $names
                | map(select(.type == "testDone" and (.hidden | not)))
                | .[] | "| \($names[.testID | tostring]) | \(.result) |"
              ' build/results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
