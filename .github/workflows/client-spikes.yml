name: Client Spikes

on:
  pull_request:
    paths:
      - "client/spikes/**"
      - ".github/workflows/client-spikes.yml"

concurrency:
  group: client-spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DRIFT_VERSION: "2.35.4"
  SQLITE3_VERSION: "3.9.1"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  spike-s6-linux:
    name: spike-s6-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/spikes/s6
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch sqlite3.wasm and drift_worker.js
        run: |
          curl -fsSL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_VERSION}/sqlite3.wasm"
          curl -fsSL -o web/drift_worker.js "https://github.com/simolus3/drift/releases/download/drift-${DRIFT_VERSION}/drift_worker.js"

      - name: Build the harness
        run: |
          flutter pub get
          flutter build web --release

      - name: Start the static server (no COOP/COEP)
        run: |
          dart run serve.dart 8080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"; exit 1

      - name: Install Playwright (outside the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium firefox

      - name: "Q1, Q2: Chromium and Firefox"
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          status=0
          node driver.cjs chromium || status=1
          node driver.cjs firefox || status=1
          exit "$status"

      - name: Write results to the job summary
        if: always()
        run: |
          {
            echo "## Spike S6 (Linux)"
            echo
            echo "Flutter: \`$(flutter --version | head -1)\`; drift ${DRIFT_VERSION}, drift_flutter $(awk '$0=="  drift_flutter:"{f=1} f&&/version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock), sqlite3 ${SQLITE3_VERSION}, Playwright ${PLAYWRIGHT_VERSION}"
            echo
            node driver.cjs summary
          } >> "$GITHUB_STEP_SUMMARY"

  spike-s6-safari:
    name: spike-s6-safari
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/spikes/s6
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch sqlite3.wasm and drift_worker.js
        run: |
          curl -fsSL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_VERSION}/sqlite3.wasm"
          curl -fsSL -o web/drift_worker.js "https://github.com/simolus3/drift/releases/download/drift-${DRIFT_VERSION}/drift_worker.js"

      - name: Build the harness
        run: |
          flutter pub get
          flutter build web --release

      - name: Start the static server (no COOP/COEP)
        run: |
          dart run serve.dart 8080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"; exit 1

      - name: Start safaridriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS -o /dev/null http://localhost:4444/status && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/safaridriver.log"; exit 1

      - name: "Q3: Safari"
        env:
          WEBDRIVER_URL: http://localhost:4444
        run: node driver.cjs safari

      - name: Write results to the job summary
        if: always()
        run: |
          {
            echo "## Spike S6 (Safari)"
            echo
            echo "macOS $(sw_vers -productVersion); Safari $(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString 2>/dev/null || echo unknown)"
            echo
            echo "Flutter: \`$(flutter --version | head -1)\`; drift ${DRIFT_VERSION}, drift_flutter $(awk '$0=="  drift_flutter:"{f=1} f&&/version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock), sqlite3 ${SQLITE3_VERSION}"
            echo
            if [[ -d results ]]; then node driver.cjs summary; else echo "safaridriver could not be started: Q3 unanswerable by CI."; fi
          } >> "$GITHUB_STEP_SUMMARY"
