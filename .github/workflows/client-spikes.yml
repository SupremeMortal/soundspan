name: Client Spikes

# Throwaway spike harnesses of docs/designs/flutter-client/13-milestones-and-work-breakdown.md
# (Spikes). Each job runs a harness on a device and writes
# its measurements to the job summary and an artifact. A spike's jobs are
# deleted together with its harness.

on:
  pull_request:
    paths:
      - "client/spikes/**"
      - ".github/workflows/client-spikes.yml"

concurrency:
  group: client-spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike-s3-android:
    name: spike-s3-android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [34, 33]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build the harness APK
        working-directory: client/spikes/s3
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the driver on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          S3_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/spikes/s3
          script: bash -o pipefail -c 'bash run.sh build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee run.log'

      - name: Summarise
        if: always()
        working-directory: client/spikes/s3
        run: |
          {
            echo "### Spike S3, Android emulator API ${{ matrix.api }}"
            echo
            echo '```'
            grep '^S3' run.log 2>/dev/null || echo "no result lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logcat and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s3-android-api${{ matrix.api }}
          path: |
            client/spikes/s3/run.log
            client/spikes/s3/results.txt
            client/spikes/s3/spike-lines.txt
            client/spikes/s3/logcat-full.txt
            client/spikes/s3/q1.ticks
            client/spikes/s3/q3.ticks
