name: Client Spikes

# Throwaway spike harnesses of docs/designs/flutter-client/13-milestones-and-work-breakdown.md
# (Spikes). Each job runs a harness's integration test on a device and writes
# its measurements to the job summary and an artifact. A spike's jobs are
# deleted together with its harness.

on:
  pull_request:
    paths:
      - "client/spikes/**"
      - ".github/workflows/client-spikes.yml"

concurrency:
  group: client-spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike-s1-android:
    name: spike-s1-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Resolve harness dependencies
        working-directory: client/spikes/s1
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the harness on an emulator
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/spikes/s1
          script: bash -o pipefail -c 'flutter test integration_test -d emulator-5554 2>&1 | tee s1.log'

      - name: Summarise
        if: always()
        working-directory: client/spikes/s1
        run: |
          touch s1.log
          dart run tool/summarize.dart s1.log android | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s1-android
          path: |
            client/spikes/s1/s1.log
            client/spikes/s1/summary.md

  spike-s1-ios:
    name: spike-s1-ios
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Resolve harness dependencies
        working-directory: client/spikes/s1
        run: flutter pub get

      - name: Install a virtual audio output device when none exists
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType || true
          if ! system_profiler SPAudioDataType | grep -q 'Output Channels'; then
            brew install --cask blackhole-2ch
            system_profiler SPAudioDataType || true
          fi

      - name: Boot an iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the harness on the simulator
        working-directory: client/spikes/s1
        run: |
          set -o pipefail
          flutter test integration_test -d "${{ steps.sim.outputs.udid }}" 2>&1 | tee s1.log

      - name: Summarise
        if: always()
        working-directory: client/spikes/s1
        run: |
          touch s1.log
          dart run tool/summarize.dart s1.log ios-simulator | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s1-ios
          path: |
            client/spikes/s1/s1.log
            client/spikes/s1/summary.md

  spike-s1-macos:
    name: spike-s1-macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Resolve harness dependencies
        working-directory: client/spikes/s1
        run: flutter pub get

      - name: Install a virtual audio output device when none exists
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType || true
          if ! system_profiler SPAudioDataType | grep -q 'Output Channels'; then
            brew install --cask blackhole-2ch
            system_profiler SPAudioDataType || true
          fi

      - name: Run the harness on macOS
        working-directory: client/spikes/s1
        run: |
          set -o pipefail
          flutter test integration_test -d macos 2>&1 | tee s1.log

      - name: Summarise
        if: always()
        working-directory: client/spikes/s1
        run: |
          touch s1.log
          dart run tool/summarize.dart s1.log macos | tee summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s1-macos
          path: |
            client/spikes/s1/s1.log
            client/spikes/s1/summary.md
