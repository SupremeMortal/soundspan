name: Client Quality

on:
  pull_request:
    paths:
      - "client/**"
      - "backend/src/routes/**"
      - "backend/src/openapi/**"
      - ".github/workflows/client-*.yml"
      - ".github/actions/client-flutter/**"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - "client/**"

permissions:
  contents: read

jobs:
  changes:
    name: Client changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.diff.outputs.client }}
      apple: ${{ steps.diff.outputs.apple }}
      api_surface: ${{ steps.diff.outputs.api_surface }}
      contract: ${{ steps.diff.outputs.contract }}
      web_storage: ${{ steps.diff.outputs.web_storage }}
      desktop: ${{ steps.diff.outputs.desktop }}
      device: ${{ steps.diff.outputs.device }}
      downloads: ${{ steps.diff.outputs.downloads }}
      release_build: ${{ steps.diff.outputs.release_build }}
      release_notes: ${{ steps.diff.outputs.release_notes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute changed areas
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo "client=true"
              echo "apple=true"
              echo "api_surface=true"
              echo "contract=true"
              echo "web_storage=true"
              echo "desktop=true"
              echo "device=true"
              echo "downloads=true"
              echo "release_build=true"
              echo "release_notes=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff against the merge base with the base branch, not the previous
          # push, so a job that failed earlier cannot be skipped later.
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"
          has() { grep -Eq "$1" <<< "$changed" && echo true || echo false; }
          {
            echo "client=$(has '^(client/|\.github/workflows/client-[^/]*\.yml$|\.github/actions/client-flutter/)')"
            echo "apple=$(has '^(client/ios/|client/macos/|client/pubspec\.lock$|client/lib/platform/|\.github/workflows/client-quality\.yml$|\.github/actions/client-flutter/)')"
            echo "api_surface=$(has '^(client/packages/soundspan_api/|client/tool/specs/|client/tool/spec_compat\.dart$|backend/src/routes/|backend/src/openapi/|\.github/workflows/client-quality\.yml$)')"
            echo "contract=$(has '^(client/packages/soundspan_api/|client/tool/specs/|client/tool/spec_compat\.dart$|client/contract_test/|client/lib/core/realtime/|backend/src/routes/|backend/src/openapi/|\.github/workflows/client-quality\.yml$)')"
            echo "web_storage=$(has '^(client/lib/platform/|client/web/|client/integration_test/web/|client/pubspec\.lock$|\.github/workflows/client-quality\.yml$)')"
            echo "desktop=$(has '^(client/linux/|client/windows/|client/lib/platform/desktop_shell/|client/lib/app/shell/window_state_controller\.dart$|client/integration_test/desktop/|client/tool/ci/|\.github/workflows/client-quality\.yml$)')"
            echo "device=$(has '^(client/lib/core/playback/engines/|client/integration_test/|client/lib/platform/player_engine/|client/lib/core/playback/media_controls/|client/lib/platform/media_controls/|client/android/|\.github/workflows/client-device-tests\.yml$)')"
            echo "downloads=$(has '^(client/lib/platform/downloader/|client/lib/core/downloads/|client/integration_test/downloads/|client/integration_test/support/throttled_file_server\.dart$|\.github/workflows/client-quality\.yml$)')"
            echo "release_build=$(has '^(\.github/workflows/client-(build|release)\.yml$|client/tool/release/|client/pubspec\.(yaml|lock)$|client/config/|client/(android|ios|linux|macos|windows|web)/)')"
            echo "release_notes=$(has '^(\.github/workflows/client-(build|release)\.yml$|client/tool/release/|client/pubspec\.(yaml|lock)$|client/config/|client/(android|ios|linux|macos|windows|web)/|CHANGELOG\.md$)')"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Read the client version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+[:space:]]*\).*$/\1/p' client/pubspec.yaml)"
          test -n "$version"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  client-analyze:
    name: client-analyze
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Format
        working-directory: client
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze client
        working-directory: client
        run: flutter analyze --fatal-infos

      - name: Layering and platform imports
        working-directory: client
        run: dart run tool/check_imports.dart

      - name: No hard-coded UI strings
        working-directory: client
        run: dart run tool/check_l10n.dart

      - name: Platform configuration
        working-directory: client
        run: dart run tool/check_platform_config.dart

      - name: Dependency and font licences
        working-directory: client
        run: dart run tool/license_audit.dart

      - name: Icons are current
        working-directory: client
        run: dart run tool/gen_icons.dart --check

      - name: Analyze soundspan_api
        working-directory: client/packages/soundspan_api
        run: dart analyze --fatal-infos

      - name: Analyze contract_test
        working-directory: client/contract_test
        run: dart analyze --fatal-infos

  # Code generation is the slowest check, so it runs beside client-analyze
  # instead of inside it.
  client-generated:
    name: client-generated
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Generated code is current
        working-directory: client
        run: |
          tool/gen.sh
          git diff --exit-code -- .

  # The client's unit and widget tests in shards; client-test merges their
  # coverage and applies the floor.
  client-test-shard:
    name: client-test-shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARDS: 3
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the socket test server
        run: npm ci --prefix client/test/support/socket_server

      - name: Test soundspan_api with coverage
        if: matrix.shard == 0
        working-directory: client/packages/soundspan_api
        run: dart test --coverage-path=coverage/lcov.info

      # Whole files per shard, so each shard compiles only its own files.
      - name: Test client with coverage
        working-directory: client
        run: |
          set -euo pipefail
          mapfile -t files < <(tool/ci/test_shard.sh "$SHARDS" "$SHARD")
          echo "Shard $SHARD of $SHARDS: ${#files[@]} test files"
          flutter test --coverage --exclude-tags golden,contract,engine "${files[@]}"

      - name: Test contract_test without a server
        if: matrix.shard == 0
        working-directory: client/contract_test
        run: dart test --exclude-tags contract,contract-destructive

      - name: Collect coverage
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          cp client/coverage/lcov.info "$RUNNER_TEMP/coverage/app-$SHARD.lcov"
          if [ -f client/packages/soundspan_api/coverage/lcov.info ]; then
            cp client/packages/soundspan_api/coverage/lcov.info "$RUNNER_TEMP/coverage/api.lcov"
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-test-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage/*
          if-no-files-found: error
          retention-days: 1

  # Keeps the client-test check name. It runs after a failed shard too, so a
  # failed shard fails this check instead of skipping it.
  client-test:
    name: client-test
    needs: [changes, client-test-shard]
    if: ${{ !cancelled() && needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.client-test-shard.result }}
        run: |
          echo "client-test-shard: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: client-test-coverage-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      - name: Merge coverage
        run: |
          set -euo pipefail
          mkdir -p client/coverage client/packages/soundspan_api/coverage
          cat "$RUNNER_TEMP"/coverage/app-*.lcov > client/coverage/lcov.info
          cp "$RUNNER_TEMP/coverage/api.lcov" client/packages/soundspan_api/coverage/lcov.info

      - name: Coverage floor
        working-directory: client
        run: dart run tool/coverage_floor.dart

  client-spec:
    name: client-spec
    needs: changes
    if: needs.changes.outputs.api_surface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install and build media metadata contract
        working-directory: packages/media-metadata-contract
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Emit the client-surface spec
        run: npm --prefix backend run openapi:emit-client

      - name: Committed spec is current
        run: git diff --exit-code -- client/packages/soundspan_api/openapi

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Spec is compatible with minServer
        working-directory: client
        run: dart run tool/spec_compat.dart

  client-contract:
    name: client-contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/contract_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate the fixture library
        run: fixtures/generate.sh

      - name: Start the contract server
        run: docker compose -f compose.yaml up -d --build --wait

      - name: Seed the contract server
        run: node seed.ts

      - name: Contract tests
        run: dart test --tags contract

      - name: Capture decode smoke fixtures
        run: dart run tool/capture_fixtures.dart --out "$RUNNER_TEMP/client-captured-fixtures"

      - name: Upload captured fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-captured-fixtures
          path: ${{ runner.temp }}/client-captured-fixtures
          if-no-files-found: warn

      - name: Destructive contract tests
        # Exit code 79 means no test matched: an empty selection passes.
        run: |
          status=0
          dart test --tags contract-destructive || status=$?
          if [[ "$status" -ne 0 && "$status" -ne 79 ]]; then exit "$status"; fi

      - name: Collect server logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color > compose-logs.txt 2>&1 || true

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-contract-logs
          path: client/contract_test/compose-logs.txt
          if-no-files-found: warn

      - name: Tear down the contract server
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans

  client-downloads-integration:
    name: client-downloads-integration
    needs: changes
    if: needs.changes.outputs.downloads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The plugin's task store lives under the XDG documents directory,
      # which path_provider resolves with xdg-user-dir.
      - name: Install ffmpeg, Xvfb and xdg-user-dirs
        run: |
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xdg-user-dirs

      - name: Generate the fixture library
        working-directory: client/contract_test
        run: fixtures/generate.sh

      - name: Start the contract server
        working-directory: client/contract_test
        run: docker compose -f compose.yaml up -d --build --wait

      - name: Seed the contract server
        working-directory: client/contract_test
        run: node seed.ts

      - name: Downloader integration test
        working-directory: client
        run: |
          xvfb-run -a flutter test integration_test/downloads -d linux \
            --tags downloads \
            --dart-define=DOWNLOADS_SEED="$GITHUB_WORKSPACE/client/contract_test/.seed/credentials.json"

      - name: Collect server logs
        if: failure()
        working-directory: client/contract_test
        run: docker compose -f compose.yaml logs --no-color > compose-logs.txt 2>&1 || true

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-downloads-integration-logs
          path: client/contract_test/compose-logs.txt
          if-no-files-found: warn

      - name: Tear down the contract server
        if: always()
        working-directory: client/contract_test
        run: docker compose -f compose.yaml down -v --remove-orphans

  client-golden:
    name: client-golden
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Golden tests
        working-directory: client
        run: flutter test --tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-golden-failures
          # pubspec.yaml anchors the common root at client/, so paths in the
          # artifact stay relative to client/.
          path: |
            client/pubspec.yaml
            client/test/**/failures/**
          if-no-files-found: warn

      - name: Render goldens on this runner
        if: failure()
        working-directory: client
        run: flutter test --tags golden --update-goldens

      - name: Upload rendered goldens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-golden-rendered
          path: |
            client/pubspec.yaml
            client/test/**/goldens/**/*.png
            !client/test/**/failures/**
          if-no-files-found: warn

  client-build-android:
    name: client-build-android
    needs: changes
    # client-build-dry-run builds this target with the same checks when
    # release_build is true.
    if: needs.changes.outputs.client == 'true' && needs.changes.outputs.release_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle*
            client/android/app/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build debug APK
        working-directory: client
        run: flutter build apk --debug --dart-define-from-file=config/dev.json

      - name: The APK has the adaptive launcher icon
        working-directory: client
        run: tool/ci/check_apk_icon.sh build/app/outputs/flutter-apk/app-debug.apk

  client-build-linux:
    name: client-build-linux
    needs: changes
    # client-build-dry-run builds this target with the same checks when
    # release_build is true.
    if: needs.changes.outputs.client == 'true' && needs.changes.outputs.release_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build Linux release
        working-directory: client
        run: flutter build linux --release --dart-define-from-file=config/dev.json

      - name: Every shared library resolves
        working-directory: client
        run: tool/check_ldd.sh build/linux/x64/release/bundle

  client-build-web:
    name: client-build-web
    needs: changes
    # client-build-dry-run builds this target with the same checks when
    # release_build is true.
    if: needs.changes.outputs.client == 'true' && needs.changes.outputs.release_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build web release
        working-directory: client
        run: flutter build web --release --dart-define-from-file=config/dev.json

      - name: The bundle ships the drift WASM files
        working-directory: client
        run: |
          test -s build/web/sqlite3.wasm
          test -s build/web/drift_worker.js

      - name: The bundle ships the committed icons
        working-directory: client
        run: |
          for icon in favicon.png icons/Icon-192.png icons/Icon-512.png icons/Icon-maskable-192.png icons/Icon-maskable-512.png; do
            cmp "web/$icon" "build/web/$icon"
          done

      - name: Bundle-size report
        working-directory: client
        run: tool/web_bundle_report.sh build/web >> "$GITHUB_STEP_SUMMARY"

  client-web-integration:
    name: client-web-integration
    needs: changes
    if: needs.changes.outputs.web_storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      # The runner image ships Google Chrome and the matching chromedriver.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4444/status > /dev/null && exit 0
            sleep 1
          done
          echo "chromedriver did not start" >&2
          exit 1

      - name: Web storage integration test
        working-directory: client
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/web/storage_web_test.dart
          -d web-server --browser-name=chrome --headless

  client-build-windows:
    name: client-build-windows
    needs: changes
    # client-build-dry-run builds this target with the same checks when
    # release_build is true.
    if: needs.changes.outputs.client == 'true' && needs.changes.outputs.release_build != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build Windows release
        working-directory: client
        run: flutter build windows --release --dart-define-from-file=config/dev.json

      - name: Single instance
        working-directory: client
        shell: pwsh
        run: tool/ci/single_instance_windows.ps1

  client-desktop-linux:
    name: client-desktop-linux
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Install the display, window manager and D-Bus
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox dbus dbus-x11 x11-utils xdotool

      - name: Start a D-Bus session, Xvfb and openbox
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            xdpyinfo -display :99 > /dev/null 2>&1 && break
            sleep 1
          done
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 2

      - name: Desktop integration test
        working-directory: client
        run: flutter test integration_test/desktop/window_test.dart -d linux

      - name: Deep link integration test
        working-directory: client
        run: flutter test integration_test/desktop/deep_link_test.dart -d linux

      - name: Build Linux release
        working-directory: client
        run: flutter build linux --release --dart-define-from-file=config/dev.json

      - name: Single instance
        working-directory: client
        run: tool/ci/single_instance_linux.sh

  client-build-macos-ios:
    name: client-build-macos-ios
    needs: changes
    # macOS runners are slow to start, so the job runs only when the
    # repository variable CLIENT_MACOS_CI is 'true'.
    if: needs.changes.outputs.apple == 'true' && vars.CLIENT_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build macOS release
        working-directory: client
        run: flutter build macos --release --dart-define-from-file=config/dev.json

      - name: Build iOS release without code signing
        working-directory: client
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/dev.json

  # The engine conformance suite on an Android emulator, an iOS simulator,
  # macOS, headless Chrome, Linux and Windows (client-device-tests.yml).
  client-device-tests:
    name: client-device-tests
    needs: changes
    if: needs.changes.outputs.device == 'true'
    uses: ./.github/workflows/client-device-tests.yml

  # Dry run of the reusable release build: every target in release mode,
  # unsigned, plus SHA256SUMS. Nothing is published; artifacts expire
  # after 7 days.
  client-build-dry-run:
    name: client-build-dry-run
    needs: changes
    if: needs.changes.outputs.release_build == 'true'
    uses: ./.github/workflows/client-build.yml
    with:
      version: ${{ needs.changes.outputs.version }}
      build-number: "${{ github.run_number }}"
      macos: ${{ vars.CLIENT_MACOS_CI == 'true' }}

  # The release workflow's tag validation and notes, without a tag: the
  # pubspec version as the tag and the notes against main's changelog.
  client-release-dry-run:
    name: client-release-dry-run
    needs: changes
    if: needs.changes.outputs.release_notes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Validate the tag client-v<pubspec version>
        working-directory: client
        run: dart run tool/release/validate_tag.dart --tag "client-v$VERSION" --pubspec pubspec.yaml

      - name: Write the release notes against main's changelog
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-CHANGELOG.md"
          mkdir -p "$RUNNER_TEMP/client-release-notes"
          dart run tool/release/release_notes.dart \
            --changelog ../CHANGELOG.md \
            --previous-changelog "$RUNNER_TEMP/main-CHANGELOG.md" \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/client-release-notes/release-notes.md"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-release-notes
          path: ${{ runner.temp }}/client-release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

      # Checks the syntax and expressions of the client workflows, the tag
      # workflow included, without running them.
      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/client-*.yml
