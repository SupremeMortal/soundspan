name: Compose Config Check

on:
  pull_request:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.local.yml
      - docker-compose.dev.yml
      - .github/workflows/compose-config-check.yml
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.local.yml
      - docker-compose.dev.yml
      - .github/workflows/compose-config-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local compose config
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate local audio analysis profile
        run: docker compose -f docker-compose.local.yml --profile audio-analysis config --quiet

      - name: Validate local DCLAP provider profile
        run: docker compose -f docker-compose.local.yml --profile vibe-provider-dclap config --quiet

      - name: Validate dev compose config
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate dev audio analysis profile
        run: docker compose -f docker-compose.dev.yml --profile audio-analysis config --quiet

      - name: Validate dev DCLAP provider profile
        run: docker compose -f docker-compose.dev.yml --profile vibe-provider-dclap config --quiet

      - name: Start root compose PostgreSQL and Redis
        env:
          POSTGRES_PASSWORD: compose-check-postgres-password
          SESSION_SECRET: compose-check-session-secret-0123456789abcdef
          SETTINGS_ENCRYPTION_KEY: compose-check-settings-key-0123456789abcdef
          INTERNAL_API_SECRET: compose-check-internal-secret-0123456789abcdef
        run: |
          status=0
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 postgres redis || status=$?
          docker compose -f docker-compose.yml ps -a postgres redis
          if [ "$status" -ne 0 ]; then
            docker compose -f docker-compose.yml logs postgres redis
          fi
          docker compose -f docker-compose.yml down -v
          exit "$status"
