name: Client Device Tests

# Device tests of the Flutter client (docs/designs/flutter-client/11-testing-and-ci.md,
# CI Workflows). Called by client-quality.yml for the engine suite when the
# engines, the engine factory, integration_test/ or this workflow changed,
# and for the desktop suite when the desktop paths changed; called by
# client-nightly.yml with both.
#
# The engine suite: every engine-conformance job runs
# integration_test/engine_conformance_test.dart against the real
# PlayerEngine of one target (an Android emulator, an iOS simulator, macOS,
# headless Chrome, Linux and Windows) with tones from the in-process (web: a
# separate process) tone server, then
# integration_test/media_controls_smoke_test.dart against the platform's OS
# media controls (audio_service; MPRIS on Linux; SMTC on Windows). The iOS
# job also runs integration_test/ios/route_picker_test.dart.
#
# The desktop suite: every desktop-integration job runs the real app from
# integration_test/desktop/ against an in-process API server (shell,
# playback with the real engine and the shortcuts, media controls, tray) on
# Linux, Windows and macOS.
#
# The patrol suite: patrol-android runs the real app with Patrol on an
# Android emulator against the contract server: sign in, play, background,
# pause and resume from the notification, and the play reported; then
# download an album, kill the app, relaunch and play it offline.
#
# The perf suite (doc 11, CI Workflows; budgets in
# client/tool/perf/budgets.json): perf-linux measures frame build times
# while scrolling the Library Songs screen over 10,000 tracks in profile
# mode; perf-android measures the median cold start of the release APK on
# an Android emulator.

on:
  workflow_call:
    inputs:
      suites:
        description: >-
          The job groups to run, separated by spaces: engine, desktop,
          patrol and perf; or all.
        type: string
        default: all

permissions:
  contents: read

jobs:
  engine-conformance-android:
    name: engine-conformance-android
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle*
            client/android/app/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted emulator snapshot, cached so later runs skip the cold boot.
      - name: Emulator snapshot cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."

      # The emulator's -noaudio null output drives ExoPlayer's clock. The run
      # boots from the cached snapshot and does not save over it.
      - name: Engine conformance on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: client
          script: |
            flutter test integration_test/engine_conformance_test.dart -d emulator-5554
            flutter test integration_test/media_controls_smoke_test.dart -d emulator-5554
            flutter test integration_test/android/playback_service_test.dart -d emulator-5554

  # The iOS and macOS jobs, and desktop-integration-macos, run only when the
  # repository variable CLIENT_MACOS_CI is 'true', because macOS runners are
  # slow to start.
  engine-conformance-ios:
    name: engine-conformance-ios
    if: (inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')) && vars.CLIENT_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Boot an iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Engine conformance on the simulator
        working-directory: client
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        # The simulator's index and position reports jitter around a
        # transition, so it gets the 100 ms gap tolerance doc 06 allows.
        run: >-
          flutter test integration_test/engine_conformance_test.dart -d "$UDID"
          --dart-define=CONFORMANCE_GAP_TOLERANCE_MS=100

      - name: Media controls smoke on the simulator
        working-directory: client
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: flutter test integration_test/media_controls_smoke_test.dart -d "$UDID"

      - name: Route picker on the simulator
        working-directory: client
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: flutter test integration_test/ios/route_picker_test.dart -d "$UDID"

  engine-conformance-macos:
    name: engine-conformance-macos
    if: (inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')) && vars.CLIENT_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      # Playback only advances with an output device; a runner may have none.
      - name: Install a virtual audio output device when none exists
        run: |
          system_profiler SPAudioDataType || true
          if ! system_profiler SPAudioDataType | grep -q 'Output Channels'; then
            brew install --cask blackhole-2ch
            system_profiler SPAudioDataType || true
          fi

      - name: Engine conformance on macOS
        working-directory: client
        run: flutter test integration_test/engine_conformance_test.dart -d macos

      - name: Media controls smoke on macOS
        working-directory: client
        run: flutter test integration_test/media_controls_smoke_test.dart -d macos

  engine-conformance-web:
    name: engine-conformance-web
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      # The page cannot host a server, so the tone server runs as a process
      # that allows every origin.
      - name: Start the tone server
        working-directory: client
        run: |
          dart tool/tone_server.dart --port 8765 > "$RUNNER_TEMP/tone_server.log" 2>&1 &
          for _ in $(seq 1 300); do
            grep -q '^TONE_SERVER=' "$RUNNER_TEMP/tone_server.log" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/tone_server.log"
          echo "the tone server did not start" >&2
          exit 1

      # The runner image ships Google Chrome and the matching chromedriver.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4444/status > /dev/null && exit 0
            sleep 1
          done
          echo "chromedriver did not start" >&2
          exit 1

      - name: Engine conformance in headless Chrome
        working-directory: client
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/engine_conformance_test.dart
          -d web-server --browser-name=chrome --headless
          --web-browser-flag=--autoplay-policy=no-user-gesture-required
          --dart-define=TONE_SERVER=http://127.0.0.1:8765

      - name: Media controls smoke in headless Chrome
        working-directory: client
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/media_controls_smoke_test.dart
          -d web-server --browser-name=chrome --headless

      - name: Tone server log
        if: always()
        run: cat "$RUNNER_TEMP/tone_server.log" || true

  engine-conformance-linux:
    name: engine-conformance-linux
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Install the libmpv runtime, Xvfb, PulseAudio and D-Bus
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmpv2 mpv xvfb pulseaudio gdb dbus

      # The runner has no sound card; mpv plays to a PulseAudio null sink in
      # real time, with the engine's production configuration. The sink is
      # kept from suspending: resuming a suspended null sink holds the start
      # of playback for about two seconds.
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio -D --exit-idle-time=-1
          for _ in $(seq 1 30); do
            pactl info > /dev/null 2>&1 && break
            sleep 1
          done
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
          pactl info

      # A hung app blocks its own test timeouts, so a watchdog prints every
      # thread's stack of the app and fails the step after 12 minutes, before the step timeout.
      # The harness sets mpv's ao to pulse on Linux, so mpv plays to the
      # PulseAudio null sink above. mpv still probes every audio output to
      # list devices (media_kit observes audio-device-list), and its PipeWire
      # probe's thread loop hangs in pw_thread_loop_stop() on the runner.
      # SPA_PLUGIN_DIR pointing nowhere makes libpipewire fail to create
      # that loop, so the probe gives up before starting a thread (doc 06).
      - name: Engine conformance on Linux
        working-directory: client
        timeout-minutes: 15
        env:
          SPA_PLUGIN_DIR: /nonexistent
        run: |
          xvfb-run -a flutter test integration_test/engine_conformance_test.dart -d linux &
          run=$!
          for _ in $(seq 1 720); do
            if ! kill -0 "$run" 2> /dev/null; then
              wait "$run"
              exit $?
            fi
            sleep 1
          done
          echo "::error::the engine conformance run hung"
          for app in $(pgrep -f 'bundle/soundspan'); do
            sudo gdb -p "$app" -batch -ex 'thread apply all bt' || true
          done
          kill "$run" || true
          exit 1

      # MPRIS registers on a session bus of its own, so the test can list it.
      - name: Media controls smoke on Linux
        working-directory: client
        timeout-minutes: 15
        run: >-
          dbus-run-session --
          xvfb-run -a flutter test integration_test/media_controls_smoke_test.dart -d linux

  engine-conformance-windows:
    name: engine-conformance-windows
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' engine ')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      # A hosted Windows runner has no audio endpoint, and the Scream virtual
      # sound card's driver install waits for a prompt nobody can answer, so
      # the harness gives MediaKitEngine mpv's timing-accurate null output
      # (integration_test/support/device_engine_harness_io.dart, doc 06).
      - name: Engine conformance on Windows
        working-directory: client
        run: flutter test integration_test/engine_conformance_test.dart -d windows

      # SmtcControls over the in-repo C++/WinRT plugin soundspan_smtc: it
      # initialises, shows a playing state with a thumbnail file, a paused
      # and the empty state and is disposed, and each plugin call is awaited.
      - name: Media controls smoke on Windows
        working-directory: client
        timeout-minutes: 15
        run: flutter test integration_test/media_controls_smoke_test.dart -d windows

  # The real app under Xvfb with openbox, a D-Bus session bus and a
  # PulseAudio null sink, which the harness gives mpv as its output (doc 06).
  desktop-integration-linux:
    name: desktop-integration-linux
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' desktop ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOG_DIR: ${{ github.workspace }}/desktop-integration-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Install the libmpv runtime, the display, the window manager, D-Bus and PulseAudio
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmpv2 mpv xvfb openbox dbus dbus-x11 x11-utils imagemagick pulseaudio

      - name: Start a D-Bus session, Xvfb, openbox and a PulseAudio null sink
        run: |
          mkdir -p "$LOG_DIR"
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 > "$LOG_DIR/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            xdpyinfo -display :99 > /dev/null 2>&1 && break
            sleep 1
          done
          DISPLAY=:99 openbox > "$LOG_DIR/openbox.log" 2>&1 &
          pulseaudio -D --exit-idle-time=-1
          for _ in $(seq 1 30); do
            pactl info > /dev/null 2>&1 && break
            sleep 1
          done
          pactl unload-module module-suspend-on-idle || true
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
          sleep 2

      # The shell, playback and tray tests start the app with the real
      # engine. mpv's PipeWire device probe hangs on the runner;
      # SPA_PLUGIN_DIR pointing nowhere makes it give up first
      # (engine-conformance-linux).
      - name: Shell smoke
        working-directory: client
        timeout-minutes: 20
        env:
          SPA_PLUGIN_DIR: /nonexistent
        run: |
          set -o pipefail
          flutter test integration_test/desktop/shell_smoke_test.dart -d linux 2>&1 | tee "$LOG_DIR/shell_smoke.log"

      - name: Playback smoke
        working-directory: client
        timeout-minutes: 15
        env:
          SPA_PLUGIN_DIR: /nonexistent
        run: |
          set -o pipefail
          flutter test integration_test/desktop/playback_smoke_test.dart -d linux 2>&1 | tee "$LOG_DIR/playback_smoke.log"

      # While the test holds the controls up, the script checks with
      # dbus-send that the session bus owns
      # org.mpris.MediaPlayer2.soundspan.instance<pid> (doc 10).
      - name: Media controls smoke and the MPRIS bus name
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          tool/ci/mpris_smoke_linux.sh 2>&1 | tee "$LOG_DIR/media_controls_smoke.log"

      # The runner's session bus has no StatusNotifier host, so initTray()
      # is false and closing the idle window quits. tray_manager exports
      # its StatusNotifierItem over D-Bus itself: no AppIndicator package.
      - name: Tray smoke
        working-directory: client
        timeout-minutes: 15
        env:
          SPA_PLUGIN_DIR: /nonexistent
        run: |
          set -o pipefail
          flutter test integration_test/desktop/tray_smoke_test.dart -d linux 2>&1 | tee "$LOG_DIR/tray_smoke.log"

      - name: Screenshot
        if: failure()
        run: import -window root -display :99 "$LOG_DIR/screenshot.png" || true

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-integration-linux
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn

  # The harness gives mpv its null output: a hosted Windows runner has no
  # audio endpoint (engine-conformance-windows).
  desktop-integration-windows:
    name: desktop-integration-windows
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' desktop ')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LOG_DIR: ${{ github.workspace }}/desktop-integration-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Shell smoke
        working-directory: client
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          flutter test integration_test/desktop/shell_smoke_test.dart -d windows 2>&1 | tee "$LOG_DIR/shell_smoke.log"

      - name: Playback smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/playback_smoke_test.dart -d windows 2>&1 | tee "$LOG_DIR/playback_smoke.log"

      # SmtcControls over the soundspan_smtc plugin.
      - name: Media controls smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/media_controls_smoke_test.dart -d windows 2>&1 | tee "$LOG_DIR/media_controls_smoke.log"

      - name: Tray smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/tray_smoke_test.dart -d windows 2>&1 | tee "$LOG_DIR/tray_smoke.log"

      - name: Screenshot
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $bitmap.Save("$env:LOG_DIR\screenshot.png")

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-integration-windows
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn

  # The production engine plays to the runner's output, or to BlackHole
  # when it has none (engine-conformance-macos).
  desktop-integration-macos:
    name: desktop-integration-macos
    if: (inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' desktop ')) && vars.CLIENT_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LOG_DIR: ${{ github.workspace }}/desktop-integration-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Install a virtual audio output device when none exists
        run: |
          mkdir -p "$LOG_DIR"
          system_profiler SPAudioDataType || true
          if ! system_profiler SPAudioDataType | grep -q 'Output Channels'; then
            brew install --cask blackhole-2ch
            system_profiler SPAudioDataType || true
          fi

      - name: Shell smoke
        working-directory: client
        timeout-minutes: 25
        run: |
          set -o pipefail
          flutter test integration_test/desktop/shell_smoke_test.dart -d macos 2>&1 | tee "$LOG_DIR/shell_smoke.log"

      - name: Playback smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/playback_smoke_test.dart -d macos 2>&1 | tee "$LOG_DIR/playback_smoke.log"

      # The audio_service adapter.
      - name: Media controls smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/media_controls_smoke_test.dart -d macos 2>&1 | tee "$LOG_DIR/media_controls_smoke.log"

      - name: Tray smoke
        working-directory: client
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/desktop/tray_smoke_test.dart -d macos 2>&1 | tee "$LOG_DIR/tray_smoke.log"

      - name: Screenshot
        if: failure()
        run: screencapture -x "$LOG_DIR/screenshot.png" || true

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-integration-macos
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn

  # The real app with Patrol on an Android emulator against the contract
  # server, started as in client-contract and published on the runner's port
  # 3030, which the emulator reaches as 10.0.2.2 (doc 11, Integration
  # (mobile)): background playback, then download, kill, relaunch and play
  # offline (integration_test/patrol/run_android.sh). One retry of the
  # emulator step absorbs emulator start-up flakiness; a second failure
  # fails the job.
  patrol-android:
    name: patrol-android
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' patrol ')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      LOG_DIR: ${{ github.workspace }}/patrol-android-logs
      COMPOSE_FILE: compose.yaml:${{ github.workspace }}/patrol-android-logs/port.compose.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle*
            client/android/app/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: |
          sudo "$GITHUB_WORKSPACE/scripts/ci/ensure-ubuntu-apt-sources.sh"
          sudo apt-get install -y --no-install-recommends ffmpeg

      # The backend is published on the runner's port 3030 instead of the
      # contract suite's 13006.
      - name: Publish the backend on port 3030
        run: |
          mkdir -p "$LOG_DIR"
          cat > "$LOG_DIR/port.compose.yaml" <<'EOF'
          services:
            backend:
              ports: !override
                - "127.0.0.1:3030:3006"
          EOF

      - name: Generate the fixture library
        working-directory: client/contract_test
        run: fixtures/generate.sh

      - name: Start the contract server
        working-directory: client/contract_test
        run: docker compose up -d --build --wait

      - name: Wait for /api/health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3030/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "the contract server is not healthy" >&2
          exit 1

      # The seeded admin has no recorded plays, so the test sees its own.
      - name: Seed the contract server
        working-directory: client/contract_test
        env:
          CONTRACT_BASE_URL: http://127.0.0.1:3030
        run: |
          node seed.ts
          {
            echo "E2E_USERNAME=$(jq -r .admin.username .seed/credentials.json)"
            echo "E2E_PASSWORD=$(jq -r .admin.password .seed/credentials.json)"
          } >> "$GITHUB_ENV"

      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli 4.9.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator snapshot cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."

      - name: Patrol on an emulator
        id: patrol
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: client
          script: integration_test/patrol/run_android.sh "$LOG_DIR/attempt-1"

      - name: Patrol on an emulator (retry)
        if: steps.patrol.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: client
          script: integration_test/patrol/run_android.sh "$LOG_DIR/attempt-2"

      - name: Collect the server logs and the Patrol report
        if: failure() || steps.patrol.outcome == 'failure'
        run: |
          (cd client/contract_test && docker compose logs --no-color > "$LOG_DIR/compose-logs.txt" 2>&1) || true
          cp -r client/build/app/reports/androidTests "$LOG_DIR/report" 2>/dev/null || true
          cp -r client/build/app/outputs/androidTest-results "$LOG_DIR/results" 2>/dev/null || true

      - name: Upload logs, report and screenshots
        if: failure() || steps.patrol.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-android
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn

      - name: Tear down the contract server
        if: always()
        working-directory: client/contract_test
        run: docker compose down -v --remove-orphans

  # Frame build times of integration_test/perf_scroll_test.dart in profile
  # mode under Xvfb: the 90th and 99th percentiles are gated, raster times
  # are printed and uploaded but not gated (the runner renders in software).
  perf-linux:
    name: perf-linux
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' perf ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The composite action apt-installs the Linux build packages of doc 01.
      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Install the libmpv runtime and Xvfb
        run: |
          sudo apt-get install -y --no-install-recommends libmpv2 xvfb

      - name: Scroll frame timings
        working-directory: client
        timeout-minutes: 25
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          flutter drive --profile -d linux
          --driver=test_driver/perf_driver.dart
          --target=integration_test/perf_scroll_test.dart

      - name: Check the frame budget
        working-directory: client
        run: |
          status=0
          dart run tool/perf/check_frame_timings.dart build/perf/scroll_songs.json > build/perf/scroll_songs.txt || status=$?
          cat build/perf/scroll_songs.txt
          {
            echo "### Scroll frame timings (scroll_songs)"
            echo
            echo '```'
            cat build/perf/scroll_songs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the frame timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-linux
          path: client/build/perf
          if-no-files-found: warn

  # The median TotalTime of five `am start -W` cold starts of the release
  # APK on the emulator of engine-conformance-android
  # (client/tool/perf/cold_start_android.sh).
  perf-android:
    name: perf-android
    if: inputs.suites == 'all' || contains(format(' {0} ', inputs.suites), ' perf ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle*
            client/android/app/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: ./.github/actions/client-flutter

      - name: Build the release APK
        working-directory: client
        run: >-
          flutter build apk --release --target-platform android-x64
          --dart-define-from-file=config/dev.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator snapshot cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."

      - name: Cold start on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: client
          script: tool/perf/cold_start_android.sh build/app/outputs/flutter-apk/app-release.apk build/perf/cold_start

      - name: Upload the cold-start runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-android
          path: client/build/perf
          if-no-files-found: warn
